<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#89BEA8" flood-opacity="0.15" />
    </filter>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F7A91" />
      <stop offset="100%" stop-color="#89BEA8" />
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="15" y="15" width="370" height="790" rx="45" fill="#FFFFFF" stroke="#F4F7F9" stroke-width="6" filter="url(#shadow)" />
  <rect x="14" y="14" width="372" height="792" rx="46" fill="none" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Dynamic Island -->
  <rect x="135" y="30" width="130" height="30" rx="15" fill="#0F1923" />
  
  <!-- Header: AI Profile -->
  <g transform="translate(0, 100)">
    <circle cx="200" cy="20" r="28" fill="url(#primaryGrad)" />
    <!-- AI icon representation -->
    <rect x="190" y="10" width="20" height="20" rx="4" fill="#FFFFFF" />
    <!-- Pulse ring -->
    <circle cx="200" cy="20" r="32" fill="none" stroke="#89BEA8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="28;40;45" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <rect x="150" y="65" width="100" height="12" rx="6" fill="#1A2B3C" />
    <rect x="170" y="85" width="60" height="8" rx="4" fill="#89BEA8" />
  </g>

  <!-- Chat Bubbles -->
  <g transform="translate(0, 240)">
    
    <!-- User Message 1 -->
    <g transform="translate(40, 0)" opacity="0">
      <rect x="220" y="0" width="110" height="45" rx="15" fill="#F1F5F9" />
      <path d="M 330 45 Q 338 45 340 55 Q 335 50 325 45 Z" fill="#F1F5F9" />
      <rect x="240" y="15" width="70" height="6" rx="3" fill="#94A3B8" />
      <rect x="240" y="27" width="50" height="6" rx="3" fill="#94A3B8" />
      
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze" />
      <animate attributeName="transform" values="translate(40, 20); translate(40, 0)" dur="0.5s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </g>
    
    <!-- AI Message 1 -->
    <g transform="translate(40, 70)" opacity="0">
      <rect x="0" y="0" width="220" height="75" rx="15" fill="url(#primaryGrad)" />
      <path d="M 0 75 Q -8 75 -10 85 Q -5 80 5 75 Z" fill="#4F7A91" />
      
      <rect x="20" y="20" width="140" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      <rect x="20" y="34" width="180" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      <rect x="20" y="48" width="110" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze" />
      <animate attributeName="transform" values="translate(40, 90); translate(40, 70)" dur="0.5s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </g>

    <!-- User Message 2 -->
    <g transform="translate(40, 170)" opacity="0">
      <rect x="180" y="0" width="150" height="45" rx="15" fill="#F1F5F9" />
      <path d="M 330 45 Q 338 45 340 55 Q 335 50 325 45 Z" fill="#F1F5F9" />
      <rect x="200" y="15" width="110" height="6" rx="3" fill="#94A3B8" />
      <rect x="200" y="27" width="80" height="6" rx="3" fill="#94A3B8" />
      
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze" />
      <animate attributeName="transform" values="translate(40, 190); translate(40, 170)" dur="0.5s" begin="3.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </g>
    
    <!-- AI Message 2 (Typing Ind is replaced by msg at 5s) -->
    <g transform="translate(40, 240)">
      <!-- Typing indicator -->
      <g id="typing" opacity="0">
        <rect x="0" y="0" width="80" height="40" rx="20" fill="#E2E8F0" />
        <circle cx="25" cy="20" r="4" fill="#94A3B8">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0s" />
        </circle>
        <circle cx="40" cy="20" r="4" fill="#94A3B8">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.2s" />
        </circle>
        <circle cx="55" cy="20" r="4" fill="#94A3B8">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.4s" />
        </circle>
        
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="3.8s" fill="freeze" />
      </g>
      
      <!-- Final Message -->
      <g opacity="0">
        <rect x="0" y="0" width="250" height="110" rx="15" fill="url(#primaryGrad)" />
        <path d="M 0 110 Q -8 110 -10 120 Q -5 115 5 110 Z" fill="#4F7A91" />
        
        <rect x="20" y="25" width="150" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
        <rect x="20" y="45" width="200" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
        <rect x="20" y="65" width="180" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
        <rect x="20" y="85" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
        
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5.8s" fill="freeze" />
        <animate attributeName="transform" values="translate(0, 20); translate(0, 0)" dur="0.5s" begin="5.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </g>
    </g>

  </g>

  <!-- Input Area -->
  <rect x="30" y="700" width="340" height="60" rx="30" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="330" cy="730" r="20" fill="#4F7A91" />
  <path d="M327 723 l0 14 m-4 -5 l4 5 l4 -5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" transform="rotate(-90 327 730)"/>
  <rect x="50" y="725" width="120" height="10" rx="5" fill="#CBD5E1" />

  <rect x="130" y="790" width="140" height="5" rx="2.5" fill="#1A2B3C" />
</svg>
