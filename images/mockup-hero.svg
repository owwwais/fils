<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#4F7A91" flood-opacity="0.15" />
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F7F9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F7A91" />
      <stop offset="100%" stop-color="#89BEA8" />
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="15" y="15" width="370" height="790" rx="45" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="6" filter="url(#shadow)" />
  <rect x="14" y="14" width="372" height="792" rx="46" fill="none" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Dynamic Island -->
  <rect x="135" y="30" width="130" height="30" rx="15" fill="#0F1923" />
  <circle cx="245" cy="45" r="5" fill="#3B5F73" />

  <!-- Header -->
  <g transform="translate(0, 100)">
    <circle cx="50" cy="0" r="22" fill="#E2E8F0" />
    <rect x="85" y="-12" width="120" height="12" rx="6" fill="#CBD5E1" />
    <rect x="85" y="4" width="80" height="8" rx="4" fill="#94A3B8" />
    
    <!-- Notification Bell -->
    <rect x="330" y="-10" width="20" height="20" rx="4" fill="#E2E8F0" />
  </g>

  <!-- Balance Circle Area -->
  <g transform="translate(200, 260)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#E2E8F0" stroke-width="20" />
    <!-- Animated Value Circle -->
    <path d="M 0 -80 A 80 80 0 1 1 -50 60" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" values="500;0" dur="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" begin="0.2s"/>
    </path>
    
    <!-- Inner details -->
    <rect x="-35" y="-15" width="70" height="10" rx="5" fill="#94A3B8" />
    <rect x="-45" y="5" width="90" height="18" rx="9" fill="#1A2B3C" />
  </g>

  <!-- Category Bars -->
  <g transform="translate(0, 420)">
    <text x="35" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A2B3C">الميزانية</text>
    
    <!-- Item 1 -->
    <g transform="translate(35, 30)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#E2E8F0" />
      <rect x="45" y="5" width="80" height="10" rx="5" fill="#1A2B3C" />
      <rect x="290" y="5" width="40" height="10" rx="5" fill="#1A2B3C" />
      <!-- Bar bg -->
      <rect x="45" y="22" width="285" height="8" rx="4" fill="#E2E8F0" />
      <!-- Bar fill animated -->
      <rect x="45" y="22" width="0" height="8" rx="4" fill="#4F7A91">
        <animate attributeName="width" values="0; 220" dur="1.5s" fill="freeze" begin="0.8s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

    <!-- Item 2 -->
    <g transform="translate(35, 90)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#E2E8F0" />
      <rect x="45" y="5" width="60" height="10" rx="5" fill="#1A2B3C" />
      <rect x="290" y="5" width="40" height="10" rx="5" fill="#1A2B3C" />
      <!-- Bar bg -->
      <rect x="45" y="22" width="285" height="8" rx="4" fill="#E2E8F0" />
      <!-- Bar fill animated -->
      <rect x="45" y="22" width="0" height="8" rx="4" fill="#89BEA8">
        <animate attributeName="width" values="0; 150" dur="1.5s" fill="freeze" begin="1s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

    <!-- Item 3 -->
    <g transform="translate(35, 150)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#E2E8F0" />
      <rect x="45" y="5" width="90" height="10" rx="5" fill="#1A2B3C" />
      <rect x="290" y="5" width="40" height="10" rx="5" fill="#1A2B3C" />
      <!-- Bar bg -->
      <rect x="45" y="22" width="285" height="8" rx="4" fill="#E2E8F0" />
      <!-- Bar fill animated -->
      <rect x="45" y="22" width="0" height="8" rx="4" fill="#6DA88E">
        <animate attributeName="width" values="0; 80" dur="1.5s" fill="freeze" begin="1.2s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>
    
    <!-- Item 4 -->
    <g transform="translate(35, 210)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#E2E8F0" />
      <rect x="45" y="5" width="70" height="10" rx="5" fill="#1A2B3C" />
      <rect x="290" y="5" width="40" height="10" rx="5" fill="#1A2B3C" />
      <!-- Bar bg -->
      <rect x="45" y="22" width="285" height="8" rx="4" fill="#E2E8F0" />
      <!-- Bar fill animated -->
      <rect x="45" y="22" width="0" height="8" rx="4" fill="#3B5F73">
        <animate attributeName="width" values="0; 250" dur="1.5s" fill="freeze" begin="1.4s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>
  </g>

  <!-- Bottom Nav -->
  <rect x="30" y="710" width="340" height="70" rx="35" fill="#FFFFFF" filter="drop-shadow(0 -10px 20px rgba(79, 122, 145, 0.05))"/>
  <rect x="60" y="730" width="30" height="30" rx="8" fill="#4F7A91" />
  <rect x="130" y="735" width="20" height="20" rx="6" fill="#CBD5E1" />
  <circle cx="200" cy="745" r="22" fill="#89BEA8" />
  <rect x="250" y="735" width="20" height="20" rx="6" fill="#CBD5E1" />
  <rect x="320" y="735" width="20" height="20" rx="6" fill="#CBD5E1" />
  
  <rect x="130" y="790" width="140" height="5" rx="2.5" fill="#1A2B3C" />
</svg>
